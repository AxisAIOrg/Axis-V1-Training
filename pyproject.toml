[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-train-infra"
version = "0.1.0"
description = "Release training infrastructure for AXIS-format LeRobot data and OpenPI Pi0.5 fine-tuning."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["axis_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
