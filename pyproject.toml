[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-train-infra"
version = "0.1.0"
description = "Release training infrastructure for AXIS-format LeRobot data and OpenPI Pi0.5 fine-tuning."
requires-python = ">=3.10"
dependencies = [
  "av>=12",
  "httpx>=0.27",
  "imageio[ffmpeg]>=2.31",
  "mujoco>=3.3,<4",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "opencv-python-headless>=4.8",
]

[project.scripts]
axis-train = "axis_train.cli:main"

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "ruff==0.12.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["axis_train*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
